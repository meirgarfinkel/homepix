# Builds HomePix on GitHub's machines.
# - Linux: the AppImage is built in AlmaLinux 9 (glibc 2.34), then its self-test runs on a fresh
#   Debian, Ubuntu, Fedora and Arch. This runs on every pull request that touches the app or its
#   packaging, so a change that breaks some distro shows up before it's merged.
# - Windows: the installer, built the same way on Windows; its self-test runs too, with the AI models.
# Pushing a tag like v0.2.0 does all of it and publishes a GitHub Release with both files.
name: Build HomePix

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - "homepix/**"
      - "homepix_app.py"
      - "homepix-icon.*"
      - "requirements.txt"
      - "packaging/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

concurrency:  # a new push to a pull request replaces the build still running for the old one
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash packaging/build_in_container.sh
      - uses: actions/upload-artifact@v4
        with:
          name: HomePix-Linux
          path: HomePix-x86_64.AppImage
          retention-days: 2  # (a build is only for checking; Releases keep their own copies)
          if-no-files-found: error

  linux-models:
    # The AI models, so the self-test can check they run on each distro. Downloaded once, then cached.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: models
          key: models-${{ hashFiles('homepix/core/ai/models.py') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          pip install numpy pillow
          HOMEPIX_HOME="$PWD/models-home" python -c \
            "from homepix.core.ai.models import MODELS, ensure_models; ensure_models(list(MODELS))"
          mv models-home/models models
      - uses: actions/upload-artifact@v4
        with:
          name: models
          path: models
          retention-days: 1

  linux-smoke:
    needs: [linux, linux-models]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false  # see every distro's result, not just the first failure
      matrix:
        distro: ["debian:12", "debian:13", "ubuntu:22.04", "ubuntu:24.04", "fedora:latest", "archlinux:latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: HomePix-Linux
      - uses: actions/download-artifact@v4
        with:
          name: models
          path: models
      - run: bash packaging/smoke_test.sh "${{ matrix.distro }}" HomePix-x86_64.AppImage models

  windows:
    needs: [linux-models]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: models
          path: build/selftest/models
      - run: choco install innosetup --no-progress -y
      - run: packaging\build_windows.bat
        shell: cmd
      - uses: actions/upload-artifact@v4
        with:
          name: HomePix-Windows
          path: HomePixSetup.exe
          retention-days: 2  # (a build is only for checking; Releases keep their own copies)

  release:
    # Only for version tags: publish both builds as a GitHub Release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-smoke, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - run: >
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes
          dist/HomePix-Linux/HomePix-x86_64.AppImage dist/HomePix-Windows/HomePixSetup.exe
        env:
          GH_TOKEN: ${{ github.token }}

  cleanup:
    # A pull request's or a tag's builds are only for the jobs above (a Release keeps its own copies):
    # delete them once those are done, so they don't fill the repository's storage. A build started by
    # hand keeps them, to download.
    if: always() && github.event_name != 'workflow_dispatch'
    needs: [linux, linux-models, linux-smoke, windows, release]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate --jq '.artifacts[].id' |
            while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"; done
        env:
          GH_TOKEN: ${{ github.token }}
