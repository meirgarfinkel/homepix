# Builds the Linux AppImage and the Windows installer on GitHub's machines,
# so you don't need a Windows computer. Run it from the repository's Actions tab
# ("Build Photo Finder" > Run workflow), or push a tag like v0.1.0 to also publish
# a GitHub Release with both files attached.
name: Build Photo Finder

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  linux:
    # Built on an older Ubuntu so the AppImage also runs on older systems.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libxcb-cursor0
      - run: bash packaging/build_linux.sh
      - run: QT_QPA_PLATFORM=offscreen ./PhotoFinder-x86_64.AppImage --appimage-extract-and-run --self-test
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoFinder-Linux
          path: PhotoFinder-x86_64.AppImage

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: choco install innosetup --no-progress -y
      - run: packaging\build_windows.bat
        shell: cmd
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoFinder-Windows
          path: PhotoFinderSetup.exe

  release:
    # Only for version tags: publish both builds as a GitHub Release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - run: >
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes
          dist/PhotoFinder-Linux/PhotoFinder-x86_64.AppImage dist/PhotoFinder-Windows/PhotoFinderSetup.exe
        env:
          GH_TOKEN: ${{ github.token }}
