# Runs on every push to every branch. `main` only accepts changes that pass.
name: CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pre-commit
      - run: pre-commit run --all-files --hook-stage pre-push --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        # what the app needs (the UI tests run offscreen, so no display), plus Qt's system libraries
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libimage-exiftool-perl
          pip install -r requirements.txt pytest
      - name: Byte-compile every module
        run: python -m compileall -q photofind photofind_app.py
      - name: Tests
        run: |
          QT_QPA_PLATFORM=offscreen pytest -q
