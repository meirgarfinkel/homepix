# Builds the HomePix phone app (android/), runs its unit tests and lint, when something in android/ or
# the desktop code it has to agree with changes.
# Pushing a tag like android-v0.2 also publishes the APK as a GitHub Release. Phone releases are never
# marked "latest": the desktop app's update check reads the latest release, which stays the desktop's.
#
# A tag build signs the APK with the repo's release key (secrets ANDROID_KEYSTORE, base64, and
# ANDROID_KEYSTORE_PASSWORD), so each release installs over the last. Pull requests use a throwaway key.

name: Build the phone app

on:
  workflow_dispatch:
  push:
    tags: ["android-v*"]
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
      # (what the phone has to agree with: the tokenizer, the quick fingerprint, its library file, the server)
      - "homepix/core/ai/clip_tokens.py"
      - "homepix/core/util.py"
      - "homepix/core/portable.py"
      - "homepix/core/phones.py"
      - "homepix/core/phone_server.py"
      - "homepix/core/db.py"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4  # the search model the build downloads (42 MB), kept between runs
        with:
          path: |
            android/app/src/main/assets/clip_text.onnx
            android/app/src/main/assets/clip_tokenizer.json
          key: clip-text-mobileclip-s0
      - if: startsWith(github.ref, 'refs/tags/android-v')
        name: Unpack the release key
        run: |
          [ -n "$KEYSTORE" ] || { echo "::error::The ANDROID_KEYSTORE secret isn't set"; exit 1; }
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "HOMEPIX_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      - if: startsWith(github.ref, 'refs/tags/android-v')
        name: The tag is the version the app says it is
        run: |
          name=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          [ "$GITHUB_REF_NAME" = "android-v$name" ] || {
            echo "::error::Tag $GITHUB_REF_NAME, versionName $name: they must agree"; exit 1; }
      - run: ./gradlew assembleRelease testDebugUnitTest lintDebug
        env:
          HOMEPIX_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - if: startsWith(github.ref, 'refs/tags/android-v')
        uses: actions/upload-artifact@v4
        with:
          name: HomePix-Android
          path: android/dist/HomePix-dev.apk
          retention-days: 1
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: [android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HomePix-Android
      - run: |
          mv HomePix-dev.apk HomePix.apk
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --latest=false \
            --title "Phone app ${GITHUB_REF_NAME#android-}" --generate-notes HomePix.apk
        env:
          GH_TOKEN: ${{ github.token }}
